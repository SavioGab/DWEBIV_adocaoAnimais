<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animais disponíveis - AdotaPet</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-animais">

    <!-- CABEÇALHO -->
    <header class="cabecalho-animais">

        <a href="{{ url_for('home') }}" class="logo-adotapet">
            🐾 AdotaPet
        </a>

        <a href="#" class="botao-doar">
            + Colocar meu pet para adoção
        </a>

    </header>


    <main class="conteudo-animais">

        <!-- TÍTULO -->
        <section class="introducao-animais">

            <h1>Encontre seu novo companheiro 🐾</h1>

            <p>
                Encontre animais que estão esperando por um novo lar.
            </p>

        </section>


        <!-- PESQUISA E FILTROS -->
        <section class="filtros-animais">

            <div class="campo-pesquisa">

                <label for="pesquisa">
                    Pesquisar animal
                </label>

                <input
                    type="search"
                    id="pesquisa"
                    placeholder="Nome, raça ou localização..."
                >

            </div>


            <div class="campo-filtro">

                <label for="filtro-tipo">
                    Tipo de animal
                </label>

                <select id="filtro-tipo">

                    <option value="todos">
                        Todos
                    </option>

                    <option value="cachorro">
                        Cachorro
                    </option>

                    <option value="gato">
                        Gato
                    </option>

                    <option value="coelho">
                        Coelho
                    </option>

                    <option value="aves">
                        Aves
                    </option>

                    <option value="peixe">
                        Peixe
                    </option>

                    <option value="outro">
                        Outro
                    </option>

                </select>

            </div>

        </section>


        <!-- MENSAGEM DE CARREGAMENTO -->
        <div
            id="carregando"
            class="mensagem-animais"
        >
            Carregando animais...
        </div>


        <!-- MENSAGEM DE ERRO -->
        <div
            id="erro-animais"
            class="mensagem-animais mensagem-erro-animais"
            hidden
        >
            Não foi possível carregar os animais.
            Tente novamente.
        </div>


        <!-- LISTA DE ANIMAIS -->
        <section
            id="lista-animais"
            class="lista-animais"
            aria-label="Animais disponíveis para adoção"
        >
        </section>


        <!-- NENHUM ANIMAL -->
        <div
            id="nenhum-animal"
            class="mensagem-animais"
            hidden
        >
            Nenhum animal encontrado.
        </div>

    </main>


    <script src="{{ url_for('static', filename='js/animais.js') }}"></script>

</body>

</html>
