<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - AdotaPet</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-login">

    <a href="{{ url_for('home') }}" class="botao-voltar">
        ← Voltar
    </a>

    <main class="login-container">

        <section class="login-card cadastro-card">

            <!-- Logo -->
            <div class="login-logo">
                <span>🐾</span>
                <strong>AdotaPet</strong>
            </div>

            <h1>Criar sua conta</h1>

            <p class="login-subtitulo">
                Cadastre-se para encontrar um novo amigo
            </p>


            <!-- Formulário -->
            <form id="formCadastro">

                <!-- Nome -->
                <div class="campo-login">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >

                    <small
                        id="erro-nome"
                        class="mensagem-erro">
                    </small>

                </div>


                <!-- E-mail -->
                <div class="campo-login">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                    <small
                        id="erro-email"
                        class="mensagem-erro">
                    </small>

                </div>


                <!-- Telefone -->
                <div class="campo-login">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        autocomplete="tel"
                        maxlength="15"
                        inputmode="numeric"
                        required
                    >

                    <small
                        id="erro-telefone"
                        class="mensagem-erro">
                    </small>

                </div>


                <!-- Senha -->
                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senha-container">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="olho"
                            id="botaoSenha"
                            aria-label="Mostrar senha"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="erro-senha"
                        class="mensagem-erro">
                    </small>

                </div>


                <!-- Confirmar senha -->
                <div class="campo-login">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <div class="senha-container">

                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="olho"
                            id="botaoConfirmarSenha"
                            aria-label="Mostrar senha"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="erro-confirmar-senha"
                        class="mensagem-erro">
                    </small>

                </div>


                <!-- Mensagem geral -->
                <div
                    id="mensagem-cadastro"
                    class="mensagem-login"
                    role="alert">
                </div>


                <!-- Botão -->
                <button
                    type="submit"
                    class="botao-entrar"
                    id="botaoCadastrar"
                >
                    Criar conta
                </button>

            </form>


            <!-- Link para login -->
            <p class="criar-conta">

                Já possui uma conta?

                <a href="{{ url_for('pagina_login') }}">
                    Entrar
                </a>

            </p>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>

</body>

</html>
