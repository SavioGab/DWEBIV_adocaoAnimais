<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação de e-mail - AdotaPet</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-login">

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                <span>🐾</span>
                <strong>AdotaPet</strong>
            </div>

            <h1 id="titulo">Confirmando seu e-mail...</h1>

            <p class="login-subtitulo" id="mensagem">
                Aguarde um momento.
            </p>

            <a
                id="botaoLogin"
                href="{{ url_for('pagina_login') }}"
                class="botao-entrar botao-link"
                style="display: none;"
            >
                Ir para o login
            </a>

        </section>

    </main>


    <script>
        const titulo = document.getElementById("titulo");
        const mensagem = document.getElementById("mensagem");
        const botaoLogin = document.getElementById("botaoLogin");

        // O Supabase manda o resultado no hash (#...) ou na
        // query (?...), dependendo do tipo de fluxo.
        const hash = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const query = new URLSearchParams(
            window.location.search
        );

        function pegar(nome) {
            return hash.get(nome) || query.get(nome);
        }

        const erro = pegar("error") || pegar("error_code");
        const descricaoErro = pegar("error_description");

        // Qualquer um destes indica que o link foi válido.
        const confirmado =
            pegar("access_token") ||
            pegar("code") ||
            pegar("type") === "signup";


        if (erro) {

            titulo.textContent = "Não foi possível confirmar";

            mensagem.textContent =
                descricaoErro
                    ? descricaoErro.replace(/\+/g, " ")
                    : "O link é inválido ou expirou. Faça o cadastro novamente.";

        } else if (confirmado) {

            // Os tokens NÃO são guardados no navegador.
            // O login é feito normalmente pela página de login.

            titulo.textContent = "E-mail confirmado!";

            mensagem.textContent =
                "Seu e-mail foi confirmado com sucesso. Agora você já pode entrar.";

            botaoLogin.style.display = "block";

            // Remove os tokens da barra de endereço
            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        } else {

            titulo.textContent = "Erro na confirmação";

            mensagem.textContent =
                "Não foi possível encontrar os dados da confirmação.";
        }
    </script>

</body>

</html>
