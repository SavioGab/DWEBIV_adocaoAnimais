<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

   <body>

    <header>
        <h1>🐾 AdotaPet</h1>

        <nav>
            <a href="animais.html">Animais</a>
            <a href="#">Como funciona</a>
            <a href="login.html">Entrar</a>
<a href="cadastro.html" class="botao-cadastro">Criar conta</a>
        </nav>
    </header>

    <main>

        <!-- Apresentação -->
        <section class="hero">

            <h2>Encontre seu novo melhor amigo!</h2>

            <p>
                Adoção responsável, um futuro melhor
                para eles e para você.
            </p>

            <div class="busca">

                <input
                    type="text"
                    placeholder="Procure por animal, raça ou cidade..."
                >

                <button>Buscar</button>

            </div>

        </section>


        <!-- Ações principais -->
        <section class="acoes">

            <a href="animais.html">
                ❤️ Quero adotar
            </a>

            <a href="#">
                🐾 Quero doar
            </a>

        </section>


        <!-- Animais em destaque -->
        <section class="destaques">

            <div class="titulo-destaques">
                <h2>Animais em destaque</h2>

                <a href="animais.html">
                    Ver todos
                </a>
            </div>


            <div class="animais">

                <article class="animal-card">

      <div class="animal-imagem">
    <img src="img/thor.jpg" alt="Thor, cachorro disponível para adoção">
</div>
                    <h3>Thor</h3>

                    <p>Cachorro • 3 anos</p>

                </article>


                <article class="animal-card">

                    <div class="animal-imagem">
    <img src="img/luna.jpg" alt="Luna, gata disponível para adoção">
</div>
                    <h3>Luna</h3>

                    <p>Gato • 2 anos</p>

                </article>


                <article class="animal-card">

                    <div class="animal-imagem">
    <img src="img/pipoca.jpg" alt="Pipoca, coelho disponível para adoção">
</div>

                    <h3>Pipoca</h3>

                    <p>Coelho • 1 ano</p>

                </article>


                <article class="animal-card">

                    <div class="animal-imagem">
    <img src="img/mel.jpg" alt="Mel, ave disponível para adoção">
</div>
                    <h3>Mel</h3>

                    <p>Ave • 2 anos</p>

                </article>

            </div>

        </section>

    </main>

</body>

</body>
</html>
