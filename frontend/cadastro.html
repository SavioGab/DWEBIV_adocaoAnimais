<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - AdotaPet</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-login">

    <main class="login-container">

        <section class="login-card cadastro-card">

            <!-- Logo -->
            <div class="login-logo">
                <span>🐾</span>
                <strong>AdotaPet</strong>
            </div>

            <!-- Título -->
            <h1>Criar sua conta</h1>

            <p class="login-subtitulo">
                Cadastre-se para encontrar um novo amigo
            </p>

            <!-- Formulário -->
            <form id="formCadastro">

           <div class="campo-login">
    <label for="nome">Nome completo</label>
    <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome completo"
        minlength="7"
        required
    >
</div>

               <div class="campo-login">
    <label for="email">E-mail</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        required
    >
</div>

               <div class="campo-login">
    <label for="telefone">Telefone</label>
    <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="(00) 00000-0000"
        maxlength="15"
        required
    >
</div>

                <div class="campo-login">
                    <label for="senha">Senha</label>

                    <div class="senha-container">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            required
                        >

                       <button type="button" class="olho" onclick="mostrarSenha('senha', this)">👁</button>
                    </div>
                </div>

                <div class="campo-login">
                    <label for="confirmar-senha">Confirmar senha</label>

                    <div class="senha-container">
                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Digite a senha novamente"
                            required
                        >

                       <button type="button" class="olho" onclick="mostrarSenha('confirmar-senha', this)">👁</button>
                    </div>
                </div>

                <button type="submit" class="botao-entrar">
                    Criar conta
                </button>

            </form>

            <!-- Voltar para login -->
            <p class="criar-conta">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>

    </main>

<script>
    function mostrarSenha(id, botao) {
        const campo = document.getElementById(id);

        if (campo.type === "password") {
            campo.type = "text";
            botao.textContent = "🙈";
        } else {
            campo.type = "password";
            botao.textContent = "👁";
        }
    }
</script>


<script>
    const form = document.getElementById("formCadastro");

    form.addEventListener("submit", function(event) {

        const nome = document.getElementById("nome").value.trim();
        const senha = document.getElementById("senha");
        const confirmarSenha = document.getElementById("confirmar-senha");

const telefone = document.getElementById("telefone");
const numerosTelefone = telefone.value.replace(/\D/g, "");

        const nomes = nome.split(/\s+/);

        const nomeValido =
            nomes.length >= 2 &&
            nomes.every(nome => /^[A-Za-zÀ-ÿ]{3,}$/.test(nome));

        if (!nomeValido) {
            event.preventDefault();

            alert("Digite seu nome completo.");

            return;
        }
if (numerosTelefone.length !== 11) {
    event.preventDefault();

    alert("Digite um telefone válido com 11 números.");

    telefone.focus();

    return;
}
        if (senha.value !== confirmarSenha.value) {
            event.preventDefault();

            alert("As senhas estão diferentes. Digite novamente.");

            senha.value = "";
            confirmarSenha.value = "";

            senha.focus();

            return;
        }

        alert("Cadastro validado com sucesso!");
    });
</script>

</body>
</html>
